name: otpflow
description: "OTP Flow — Receive · Manage · Stay Ahead"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^17.2.4
  flutter_background: ^1.3.0+1
  path_provider: ^2.1.5
  intl: ^0.19.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
